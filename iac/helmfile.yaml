repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: postgres
    namespace: meitaka
    chart: bitnami/postgresql
    version: "15.5.38"
    values:
      - values/postgres.yaml

  - name: redis
    namespace: meitaka
    chart: bitnami/redis
    version: "19.6.4"
    values:
      - values/redis.yaml

  - name: keycloak
    namespace: meitaka
    chart: bitnami/keycloak
    version: "21.4.6"
    values:
      - values/keycloak.yaml
