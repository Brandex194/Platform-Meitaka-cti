apiVersion: apps/v1
kind: Deployment
metadata:
  name: meitaka-api
  namespace: meitaka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meitaka-api
  template:
    metadata:
      labels:
        app: meitaka-api
    spec:
      containers:
        - name: api
          image: ghcr.io/meitaka/api:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: meitaka-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: faiss
              mountPath: /data/faiss
      volumes:
        - name: faiss
          persistentVolumeClaim:
            claimName: faiss-data
---
apiVersion: v1
kind: Service
metadata:
  name: meitaka-api
  namespace: meitaka
spec:
  selector:
    app: meitaka-api
  ports:
    - port: 8000
      targetPort: 8000
