apiVersion: batch/v1
kind: Job
metadata:
  name: meitaka-migrate
  namespace: meitaka
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/meitaka/api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: meitaka-secrets
