apiVersion: apps/v1
kind: Deployment
metadata:
  name: meitaka-frontend
  namespace: meitaka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meitaka-frontend
  template:
    metadata:
      labels:
        app: meitaka-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/meitaka/frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: meitaka-frontend
  namespace: meitaka
spec:
  selector:
    app: meitaka-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meitaka
  namespace: meitaka
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: meitaka-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meitaka-frontend
                port:
                  number: 80
