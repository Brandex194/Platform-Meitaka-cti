# Copy to secrets.yaml, fill values, then: kubectl apply -f secrets.yaml
# NEVER commit secrets.yaml to git.
apiVersion: v1
kind: Secret
metadata:
  name: meitaka-secrets
  namespace: meitaka
type: Opaque
stringData:
  DATABASE_URL: "postgresql://meitaka:CHANGE_ME@postgres-postgresql.meitaka.svc/meitaka"
  REDIS_URL: "redis://redis-master.meitaka.svc:6379/0"
  SECRET_KEY: "CHANGE_ME_32_CHARS_MIN"
  POSTGRES_PASSWORD: "CHANGE_ME"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME"
  SIEM_INBOUND_KEY: "CHANGE_ME"
  SIEM_OUTBOUND_URL: ""
  FAISS_INDEX_PATH: "/data/faiss/ioc.index"
