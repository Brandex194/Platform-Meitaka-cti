[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "sqlalchemy==2.0.*",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "celery[redis]==5.4.*",
    "redis>=5.0",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
    "packaging>=24",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "pytest-mock",
    "pytest-httpx>=0.30",
    "fakeredis>=2.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
