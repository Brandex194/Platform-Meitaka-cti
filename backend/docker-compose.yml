services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:25
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-dev.json:/opt/keycloak/data/import/realm.json:ro

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/sentinel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel_app:sentinel_app@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - faiss_index:/data/faiss

  worker:
    build: .
    command: celery -A app.worker.celery_app worker -Q sentinel -c 1
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel_app:sentinel_app@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - faiss_index:/data/faiss

  beat:
    build: .
    command: celery -A app.worker.celery_app beat
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started

volumes:
  pgdata:
  faiss_index:
